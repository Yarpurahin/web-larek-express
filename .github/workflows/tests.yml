name: Tests 13 sprint

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
env:
  DIR_TESTS: /tmp/tests-web-larek-express
  REP_TESTS: https://github.com/Yandex-Practicum/tests-web-larek-express.git
jobs:
  test_backend:
    runs-on: ubuntu-latest
    steps:
    - name: Set up GitHub Actions
      uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
    - name: Get testing lib
      run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
    - name: Run tests
      run: bash $DIR_TESTS/bin/backend.sh
  test_endpoints:
    runs-on: ubuntu-latest
    steps:
    - name: Set up GitHub Actions
      uses: actions/checkout@v4
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
    - name: Get testing lib
      run: set -eu && git clone --depth 1 $REP_TESTS $DIR_TESTS
    - name: Start project
      run: bash $DIR_TESTS/bin/start_project.sh
    - name: Run tests
      env:
        TEST_API_URL: http://127.0.0.1/api
      run: |
        npm exec --yes --package=wait-port@1.0.4 -- wait-port -t 120000 127.0.0.1:80
        node --input-type=module - "$DIR_TESTS/collections/sprint-13.json" "$RUNNER_TEMP/weblarek-admin.json" <<'NODE'
        import { randomUUID } from 'node:crypto';
        import { readFile, writeFile } from 'node:fs/promises';

        const [, , input, output] = process.argv;
        const baseUrl = process.env.TEST_API_URL;
        const collection = JSON.parse(await readFile(input, 'utf8'));
        const products = collection.item.find(({ name }) => name === 'product').item;

        async function post(route, body, headers) {
          const response = await fetch(baseUrl + route, { method: 'POST', body, headers });
          if (!response.ok) throw new Error(`POST ${route} returned HTTP ${response.status}`);
          return response.json();
        }

        const { accessToken } = await post('/auth/register', JSON.stringify({
          email: `ci-${randomUUID()}@example.com`,
          password: randomUUID(),
        }), { 'Content-Type': 'application/json' });
        const authorization = `Bearer ${accessToken}`;
        const png = await readFile('backend/src/public/images/Butterfly.png');
        const form = new FormData();
        form.set('file', new Blob([png], { type: 'image/png' }), 'image.png');
        const image = await post('/upload', form, { Authorization: authorization });

        for (const { request } of products) {
          if (request.method !== 'POST') continue;
          request.header.push({ key: 'Authorization', value: '{{ciAuthorization}}' });
          if (request.body?.mode === 'raw') {
            request.body.raw = request.body.raw.replaceAll('/images/image.png', image.fileName);
          }
        }
        collection.variable.find(({ key }) => key === 'baseUrl').value = baseUrl;
        collection.variable.push({ key: 'ciAuthorization', value: authorization });
        await writeFile(output, JSON.stringify(collection), { mode: 0o600 });
        NODE
        npm exec --yes --package=newman@5.3.2 -- newman run "$RUNNER_TEMP/weblarek-admin.json" --color on --verbose
